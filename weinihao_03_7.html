const path={key:'',radii:[]};
function resizeScene(){
 const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
 updatePose();dirty=true;
}
function rollingRotation(degrees){
 const a=degrees*RAD;
 // Together with the tablet turn, the body makes one full roll per 180°.
 // A gentle speed change suggests tipping over an edge; there is no endpoint snap.
 return a-.35*Math.sin(2*a);
}
function projectedHull(degrees,rotation=rollingRotation(degrees)){
 const hull=[],a=degrees*RAD,c=Math.cos(a),s=Math.sin(a),pitch=s*tilt*RAD,cp=Math.cos(pitch),sp=Math.sin(pitch),cr=Math.cos(rotation),sr=Math.sin(rotation);
 // Same projection as the shader, including the outermost cube thickness.
 for(const x of [-34.05,34.05])for(const y of [-34.05,34.05])for(const z of [-34.05,34.05]){
  const px=c*x+s*z,pz=-s*x+c*z,py=cp*y-sp*pz,depth=sp*y+cp*pz;
  const k=scene.scale/(1-depth*Math.abs(s)/240),sx=px*k,sy=-py*k;
  hull.push({x:cr*sx-sr*sy,y:sr*sx+cr*sy});
 }
 return hull;
}
function rotatedHull(){return projectedHull(angle,body.rotation);}
function bodyBounds(){const pts=rotatedHull();return {left:body.x+Math.min(...pts.map(p=>p.x)),right:body.x+Math.max(...pts.map(p=>p.x)),top:body.y+Math.min(...pts.map(p=>p.y)),bottom:body.y+Math.max(...pts.map(p=>p.y))};}
function preparePath(){
 const key=[scene.width,scene.height,tilt].join(':');if(path.key===key)return;
 path.key=key;path.radii=[];
 // One predetermined position per degree. Rebuild only for a perspective change.
 for(let degree=0;degree<360;degree++){
  const a=degree*RAD,gx=Math.sin(a),gy=Math.cos(a),pts=projectedHull(degree);
  const sx=gx<0?-1:1,sy=gy<0?-1:1;
  const roomX=Math.max(1,scene.width/2-Math.max(...pts.map(p=>sx*p.x))-8);
  const roomY=Math.max(1,scene.height/2-Math.max(...pts.map(p=>sy*p.y))-8);
  // Follow the rotating support corners closely to the frame, easing across wall changes.
  // The center remains toward the ground while its height follows the body's rolling hull.
  const ux=Math.abs(gx)/roomX,uy=Math.abs(gy)/roomY;
  path.radii.push(1/Math.pow(Math.pow(ux,16)+Math.pow(uy,16),1/16));
 }
}
function poseForAngle(degrees){
 preparePath();
 const wrapped=wrap(degrees),i=Math.floor(wrapped),t=wrapped-i;
 const p0=path.radii[(i+359)%360],p1=path.radii[i],p2=path.radii[(i+1)%360],p3=path.radii[(i+2)%360];
 // Periodic cubic interpolation also stays smooth across 359° → 0° and in reverse.
 const radius=.5*(2*p1+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);
 const a=degrees*RAD;
 // The text can lean and turn upside down in motion, returning upright at 0° / 180°.
 return {x:Math.sin(a)*radius,y:Math.cos(a)*radius,rotation:rollingRotation(degrees)};
}
function updatePose(){Object.assign(body,poseForAngle(angle));}
function draw(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5,Math.sqrt(1920000/(rect.width*rect.height))),w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniform1f(uniforms.angle,angle*RAD);gl.uniform1f(uniforms.aspect,w/h);gl.uniform1f(uniforms.tilt,tilt*RAD);gl.uniform1f(uniforms.roll,-body.rotation);
 gl.uniform2f(uniforms.viewport,scene.width,scene.height);gl.uniform2f(uniforms.bodyPosition,body.x,-body.y);gl.uniform1f(uniforms.bodyScale,scene.scale);
 gl.uniform1i(uniforms.spacing,spacing);gl.uniform1f(uniforms.pointSize,pointSize);gl.uniform1f(uniforms.impulse,impulse);
 gl.uniform1f(uniforms.backgroundGain,Math.sqrt((24/window.SafetyGeometry.axisForStep(spacing).length)**3)*(248/68));
 gl.uniform2f(uniforms.renderSize,w,h);gl.uniformMatrix3fv(uniforms.inverseRotation,false,inverseRotationMatrix());
 gl.drawArrays(gl.TRIANGLES,0,6);dirty=false;
}
function updateReadout(){
 const value=wrap(angle),target=wrap(targetAngle);$('angle').value=target===0&&targetAngle>0?360:target;$('degrees').textContent=String(Math.round(value));
 const t=(1-Math.cos(angle*RAD))/2;$('phrase').textContent=t<.12?'這麼晚還不回家':t>.88?'我怕你出事':'話語正在轉換';
}
function setAngle(a){if(Number.isFinite(a)){targetAngle=a;dirty=true;}}
function stopSensor(){sensor=false;dirty=true;previousQ=null;clearTimeout(sensorTimer);window.removeEventListener('deviceorientation',onOrientation);$('gyro').classList.remove('active');$('gyro').textContent='啟用陀螺儀';}
function manual(a){auto=false;$('play').textContent='自動旋轉';stopSensor();setAngle(a);}
$('angle').oninput=e=>manual(+e.target.value);document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>manual(+b.dataset.angle));$('tilt').oninput=e=>{tilt=+e.target.value;dirty=true;};
$('play').onclick=()=>{stopSensor();auto=!auto;$('play').textContent=auto?'暫停旋轉':'自動旋轉';};
$('reset').onclick=()=>{auto=false;$('play').textContent='自動旋轉';previousQ=null;setAngle(0);say(sensor?'已重新校正：目前姿勢為 0°，方體將回到下方中央。':'正在回到下方中央。');};
function onOrientation(e){if(!sensor||![e.alpha,e.beta,e.gamma].every(Number.isFinite))return;sensorSeen=true;clearTimeout(sensorTimer);const [a,b,g]=[e.alpha,e.beta,e.gamma].map(n=>n*RAD/2),ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);const q=[ca*sb*cg-sa*cb*sg,ca*cb*sg+sa*sb*cg,ca*sb*sg+sa*cb*cg,ca*cb*cg-sa*sb*sg];if(previousQ){const p=previousQ;let w=p[3]*q[3]+p[0]*q[0]+p[1]*q[1]+p[2]*q[2],z=p[3]*q[2]-p[2]*q[3]-p[0]*q[1]+p[1]*q[0];if(w<0){w=-w;z=-z;}const delta=-2*Math.atan2(z,w)/RAD;if(Math.abs(delta)<55)setAngle(targetAngle+delta);}previousQ=q;}
$('gyro').onclick=async()=>{if(sensor){stopSensor();say('已切換為手動控制。');return;}try{if(!isSecureContext)throw Error('請透過 HTTPS 網址啟用感測器。');if(!window.DeviceOrientationEvent)throw Error('此裝置沒有提供方向感測器，仍可拖曳操作。');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('尚未取得動作與方向權限，仍可拖曳操作。');auto=false;$('play').textContent='自動旋轉';previousQ=null;sensorSeen=false;sensor=true;setAngle(0);window.addEventListener('deviceorientation',onOrientation,{passive:true});$('gyro').classList.add('active');$('gyro').textContent='停用陀螺儀';say('已校正 0°，請像轉動方向盤一樣旋轉平板。建議鎖定螢幕方向。');sensorTimer=setTimeout(()=>{if(!sensorSeen){stopSensor();say('沒有收到感測資料，請用平板 Safari 開啟，或繼續拖曳操作。');}},5000);}catch(e){stopSensor();say(e.message);}};
let drag=null;canvas.onpointerdown=e=>{manual(targetAngle);drag={x:e.clientX,a:targetAngle};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag)setAngle(drag.a+(e.clientX-drag.x)*.5);};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();manual(e.key==='Home'?0:e.key==='End'?180:targetAngle+(e.key==='ArrowRight'?1:-1));}};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else say('此裝置不提供全螢幕，可用「隱藏介面」觀看。');}catch(e){say('無法進入全螢幕，可用「隱藏介面」觀看。');}};
function setClean(clean){document.body.classList.toggle('clean',clean);$('restore').hidden=!clean;}
$('clean').onclick=()=>setClean(true);$('restore').onclick=()=>setClean(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setClean(!document.body.classList.contains('clean'));}});
new ResizeObserver(()=>{resizeScene();dirty=true;}).observe(canvas);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();say('繪圖暫停，請重新載入頁面。');});
window.safety={setAngle:a=>manual(a),renderAt:a=>{manual(a);angle=a;updatePose();updateReadout();draw();},getState:()=>({angle,targetAngle,roll:body.rotation/RAD,position:{x:body.x,y:body.y},motion:'angle-rolling',pathSamples:path.radii.length,bounds:bodyBounds(),viewport:{width:scene.width,height:scene.height},count:geometry.cells,designGrid:248,latticeGrid:window.SafetyGeometry.axisForStep(spacing).length,volume:[248,248,248],renderer:'voxel-surface-raycast',pointSize,spacing,impulse,sensor,auto,glError:gl.getError()}),capture:()=>canvas.toDataURL()};
resizeScene();updateReadout();
function frame(now){
 const elapsed=Math.min(Math.max((now-last)/1000,0),.05);last=now;
 const previousPose=[angle,body.x,body.y,body.rotation];
 if(auto)targetAngle+=elapsed*12;
 // Smooth input changes without overshoot; every visible angle still has one exact pose.
 angle+=(targetAngle-angle)*(1-Math.exp(-elapsed*12));
 if(Math.abs(targetAngle-angle)<.0001)angle=targetAngle;
 updatePose();
 const pose=[angle,body.x,body.y,body.rotation];
 if(dirty||pose.some((value,i)=>Math.abs(value-previousPose[i])>1e-9)){updateReadout();draw();}
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();});
requestAnimationFrame(frame);
</script>
