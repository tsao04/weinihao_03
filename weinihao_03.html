function draw(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(uniforms.angle,angle*RAD);gl.uniform1f(uniforms.aspect,w/h);gl.uniform1f(uniforms.tilt,tilt*RAD);gl.uniform1f(uniforms.roll,sensor?angle*RAD:0);gl.uniform1i(uniforms.spacing,spacing);gl.uniform1f(uniforms.pointSize,pointSize);gl.uniform1f(uniforms.impulse,impulse);gl.drawArraysInstanced(gl.TRIANGLES,0,36,geometry.instances);dirty=false;}
function setAngle(a){angle=a;dirty=true;const value=wrap(a);$('angle').value=value;$('degrees').textContent=String(Math.round(value));const t=(1-Math.cos(a*RAD))/2;$('phrase').textContent=t<.12?'這麼晚還不回家':t>.88?'我怕你出事':'話語正在轉換';}
function stopSensor(){sensor=false;dirty=true;previousQ=null;clearTimeout(sensorTimer);window.removeEventListener('deviceorientation',onOrientation);$('gyro').classList.remove('active');$('gyro').textContent='啟用陀螺儀';}
function manual(a){auto=false;$('play').textContent='自動旋轉';stopSensor();setAngle(a);}
$('angle').oninput=e=>manual(+e.target.value);document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>manual(+b.dataset.angle));$('tilt').oninput=e=>{tilt=+e.target.value;dirty=true;};
$('play').onclick=()=>{stopSensor();auto=!auto;$('play').textContent=auto?'暫停旋轉':'自動旋轉';};
$('reset').onclick=()=>{previousQ=null;setAngle(0);say(sensor?'已重新校正：目前姿勢為 0°。':'已回到 0°。');};
function onOrientation(e){if(!sensor||![e.alpha,e.beta,e.gamma].every(Number.isFinite))return;sensorSeen=true;clearTimeout(sensorTimer);const [a,b,g]=[e.alpha,e.beta,e.gamma].map(n=>n*RAD/2),ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);const q=[ca*sb*cg-sa*cb*sg,ca*cb*sg+sa*sb*cg,ca*sb*sg+sa*cb*cg,ca*cb*cg-sa*sb*sg];if(previousQ){const p=previousQ;let w=p[3]*q[3]+p[0]*q[0]+p[1]*q[1]+p[2]*q[2],z=p[3]*q[2]-p[2]*q[3]-p[0]*q[1]+p[1]*q[0];if(w<0){w=-w;z=-z;}const delta=-2*Math.atan2(z,w)/RAD;if(Math.abs(delta)<55)setAngle(angle+delta);}previousQ=q;}
$('gyro').onclick=async()=>{if(sensor){stopSensor();say('已切換為手動控制。');return;}try{if(!isSecureContext)throw Error('請透過 HTTPS 網址啟用感測器。');if(!window.DeviceOrientationEvent)throw Error('此裝置沒有提供方向感測器，仍可拖曳操作。');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('尚未取得動作與方向權限，仍可拖曳操作。');auto=false;$('play').textContent='自動旋轉';previousQ=null;sensorSeen=false;sensor=true;setAngle(0);window.addEventListener('deviceorientation',onOrientation,{passive:true});$('gyro').classList.add('active');$('gyro').textContent='停用陀螺儀';say('已校正 0°，請像轉動方向盤一樣旋轉平板。建議鎖定螢幕方向。');sensorTimer=setTimeout(()=>{if(!sensorSeen){stopSensor();say('沒有收到感測資料，請用平板 Safari 開啟，或繼續拖曳操作。');}},5000);}catch(e){stopSensor();say(e.message);}};
let drag=null;canvas.onpointerdown=e=>{manual(angle);drag={x:e.clientX,a:angle};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag)setAngle(drag.a+(e.clientX-drag.x)*.5);};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();manual(e.key==='Home'?0:e.key==='End'?180:angle+(e.key==='ArrowRight'?1:-1));}};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else say('此裝置不提供全螢幕，可用「隱藏介面」觀看。');}catch(e){say('無法進入全螢幕，可用「隱藏介面」觀看。');}};
$('clean').onclick=()=>{document.body.classList.add('clean');$('restore').hidden=false;dirty=true;};$('restore').onclick=()=>{document.body.classList.remove('clean');$('restore').hidden=true;dirty=true;};new ResizeObserver(()=>dirty=true).observe(canvas);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();say('繪圖暫停，請重新載入頁面。');});
window.safety={setAngle:a=>{manual(a);draw();},getState:()=>({angle,count:geometry.instances,designGrid:68,latticeGrid:geometry.axis.length,pointSize,spacing,impulse,sensor,auto,glError:gl.getError()}),capture:()=>canvas.toDataURL()};
function frame(now){if(auto){setAngle(angle+Math.min(now-last,100)*.012);}last=now;if(dirty)draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
